<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg"> 
  <!-- Inner rounded square -->
  <rect x="50" y="50" width="1000" height="1000" rx="0" fill="#ffffff"/>
  
  <!-- X symbol in center -->
  <g transform="translate(500, 500)">
    <!-- First diagonal of X -->
    <line x1="-250" y1="-250" x2="250" y2="250" stroke="#000000" stroke-width="90" stroke-linecap="round"/>
    <!-- Second diagonal of X -->
    <line x1="250" y1="-250" x2="-250" y2="250" stroke="#000000" stroke-width="90" stroke-linecap="round"/>
  </g>
</svg>